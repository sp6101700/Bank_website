<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SecureBank – Smart Banking & Automation Demo</title>
<style>
:root{--navy:#0a2540;--navy2:#123a66;--sky:#e6f1fb;--ac:#1f6fdc;--bt:#fff;--bg:#f5f8fc;--card:#fff;--tx:#14202e;--mut:#5b6b7d;--bd:#d8e2ee;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#0b1b30;--navy2:#16365c;--sky:#14263d;--ac:#5aa2ff;--bt:#04152a;--bg:#0c1522;--card:#13202f;--tx:#e6edf5;--mut:#93a4b8;--bd:#25384e;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--navy:#0b1b30;--navy2:#16365c;--sky:#14263d;--ac:#5aa2ff;--bt:#04152a;--bg:#0c1522;--card:#13202f;--tx:#e6edf5;--mut:#93a4b8;--bd:#25384e;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
a{color:var(--ac)}.wrap{max-width:1080px;margin:0 auto;padding:0 16px}.mut{color:var(--mut)}
header{background:var(--navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{display:flex;gap:9px;align-items:center;color:#fff;font-weight:700;font-size:19px;text-decoration:none}
.logo i{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:#4f9cf5;font-style:normal}
nav{display:flex;gap:4px;align-items:center}
nav a,nav button{color:#dbe8f7;text-decoration:none;padding:8px 12px;border-radius:8px;border:0;background:none;font:inherit;cursor:pointer}
nav a:hover,nav button:hover,nav a.on{background:rgba(255,255,255,.13);color:#fff}
nav a.cta{background:#4f9cf5;color:#04152a;font-weight:600}
.burger{display:none;background:none;border:1px solid #3a5a80;color:#fff;border-radius:8px;padding:6px 12px;font-size:18px;cursor:pointer}
@media(max-width:820px){.burger{display:block}nav{display:none;position:absolute;top:60px;left:0;right:0;background:var(--navy);flex-direction:column;align-items:stretch;padding:8px 16px 14px}nav.open{display:flex}}
.btn{display:inline-block;padding:10px 18px;border-radius:10px;border:1px solid transparent;font:inherit;font-weight:600;cursor:pointer;background:var(--ac);color:var(--bt);text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.1)}.btn.alt{background:transparent;color:var(--ac);border-color:var(--ac)}.btn.wh{background:#fff;color:#0a2540}.btn.red{background:var(--bad);color:#fff}.btn.sm{padding:5px 11px;font-size:13px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:64px 0}.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.15;margin:0 0 12px}.hero p{max-width:560px;color:#cfe0f3;font-size:17px}.hero .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.sec{padding:40px 0}h2{margin:0 0 6px;color:var(--tx)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px}.card h3{margin:6px 0}
a.card{text-decoration:none;color:inherit;display:block}a.card:hover{border-color:var(--ac)}
.ic{font-size:28px}.stat{font-size:26px;font-weight:700}.stat small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
.demo{background:var(--sky);border:1px dashed var(--ac);border-radius:10px;padding:10px 14px;font-size:14px;margin:12px 0}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--card);color:var(--tx)}
.fc{max-width:560px;margin:30px auto}.two{display:grid;gap:0 14px;grid-template-columns:1fr 1fr}@media(max-width:560px){.two{grid-template-columns:1fr}}
.err{color:var(--bad);font-size:14px}.err ul{margin:10px 0 0;padding-left:20px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);font-size:14px;white-space:nowrap}th{color:var(--mut);font-weight:600}
.b{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--sky);color:var(--ac)}.b.g{color:var(--ok)}.b.r{color:var(--bad)}.b.y{color:var(--warn)}
.cr{color:var(--ok);font-weight:600}.dr{color:var(--bad);font-weight:600}
.bal{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:22px}.bal .stat{font-size:34px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs .btn{background:var(--card);color:var(--tx);border-color:var(--bd)}.tabs .btn.on{background:var(--ac);color:var(--bt)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px}.kv b{color:var(--mut);font-weight:600}
.bars div{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}.bars span{height:12px;background:var(--ac);border-radius:6px;display:block}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;margin:8px 0}summary{cursor:pointer;font-weight:600}
footer{background:var(--navy);color:#b9cde4;padding:28px 0;margin-top:30px;font-size:14px}footer a{color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;z-index:60;max-width:92%;display:none;box-shadow:0 6px 24px rgba(0,0,0,.3)}#toast.bad{background:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(5,15,30,.6);z-index:50;display:grid;place-items:center;padding:16px}.rc{background:var(--card);color:var(--tx);border-radius:14px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow:auto}.rc .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
@media print{body>*:not(#modal){display:none!important}.ov{position:static;background:none}.row{display:none!important}body::before{display:none}}
</style></head><body>
<header><div class="wrap bar"><a class="logo" href="#home"><i>🏦</i>SecureBank</a><button class="burger" data-act="menu" aria-label="Menu">☰</button><nav id="nav"></nav></div></header>
<main id="app"></main>
<footer><div class="wrap"><b style="color:#fff">SecureBank</b> – “Your Trust, Our Priority”<br>⚠ SecureBank is a <b>fictional educational demo</b>. No real money, bank accounts, licences, RBI approvals or deposit insurance are involved. All deposits, withdrawals and notifications are simulated.<br><a href="#about">About</a> · <a href="#services">Services</a> · <a href="#contact">Contact</a></div></footer>
<div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fd=i=>new Date(i).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}),p2=n=>String(n).padStart(2,'0');
const ld=i=>{const d=new Date(i);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())},now=()=>new Date().toISOString();
const KEY='securebank_demo_v1';let db,mem=null,S={reg:null,flt:{},tab:'overview',aq:'',rst:false,rid:null},tt;
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):mem}catch(e){return mem}}
function save(){mem=db;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
async function hash(p,s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s+p)h=((h*33)^c.charCodeAt(0))>>>0;return'x'+h}}
const me=()=>db&&db.users.find(x=>x.id===db.session);
const tid=()=>'TXN'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,6).toUpperCase();
function newAcc(){let a;do{a='SB'+(10000000+Math.floor(Math.random()*89999999))}while(db.users.some(u=>u.acct&&u.acct.no===a));return a}
function toast(m,k){const t=$('#toast');t.textContent=m;t.className=k||'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3800)}
function notify(u,event,message){db.notifs.unshift({id:'NTF'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),uid:u.id,to:u.mobile,channel:'WhatsApp (demo mode)',event,message,status:'Simulated – not sent',error:'Demo mode: no WhatsApp Cloud API credentials configured, nothing was delivered.',ts:now()})}
function startOtp(u,again){const code=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000);S.otp={uid:u.id,code,exp:Date.now()+3e5,tries:0};
 notify(u,'Login OTP','Your SecureBank demo login OTP is ••••••. Valid for 5 minutes. Do not share it.');save();render();toast(again?'New OTP generated (demo mode).':'OTP generated (demo mode – not actually sent).')}
async function seed(){
 const ago=d=>new Date(Date.now()-d*864e5-Math.random()*36e5).toISOString();
 db={v:1,seq:1003,session:null,users:[],txns:[],notifs:[]};
 const add=async(o,tx)=>{const salt='s'+o.id,u={...o,salt,pw:await hash(o.pw,salt),created:ago(40)};db.users.push(u);
  if(u.role==='customer'){let b=0;for(const[type,amt,method,desc,d]of tx){b+=type==='Deposit'?amt:-amt;db.txns.push({id:tid(),uid:u.id,acc:u.acct.no,type,amount:amt,method,desc,ts:ago(d),bal:b})}u.acct.balance=b;
   notify(u,'Registration',`Welcome to SecureBank! Your demo registration was successful. Your Customer ID is ${u.id}.`)}};
 await add({id:'ADM001',role:'admin',name:'SecureBank Admin',email:'admin@securebank.demo',mobile:'9000000000',dob:'1990-01-01',address:'Demo Head Office, Sangli',pw:'Admin@123'});
 await add({id:'CUST1001',role:'customer',name:'Aarav Sharma',email:'aarav@demo.in',mobile:'9876543210',dob:'1998-04-12',address:'12 Station Road, Sangli, Maharashtra',pw:'Demo@1234',acct:{no:'SB10000001',type:'Savings',status:'Active',balance:0}},
  [['Deposit',50000,'Bank Transfer Demo','Initial funding',30],['Deposit',12000,'UPI Demo','Salary advance',20],['Withdrawal',3500,'Demo Cash','Groceries',12],['Deposit',8000,'UPI Demo','Freelance payment',5],['Withdrawal',2000,'Demo Cash','ATM demo withdrawal',2]]);
 await add({id:'CUST1002',role:'customer',name:'Priya Patel',email:'priya@demo.in',mobile:'9812345678',dob:'2000-09-23',address:'45 MG Road, Pune, Maharashtra',pw:'Demo@1234',acct:{no:'SB10000002',type:'Savings',status:'Active',balance:0}},
  [['Deposit',25000,'Demo Cash','Pocket money',25],['Withdrawal',5000,'Demo Cash','Books',10],['Deposit',15000,'Bank Transfer Demo','Scholarship demo',3]]);
 await add({id:'CUST1003',role:'customer',name:'Rohan Deshmukh',email:'rohan@demo.in',mobile:'9923456789',dob:'1995-01-30',address:'7 Lake View, Kolhapur, Maharashtra',pw:'Demo@1234',acct:{no:'SB10000003',type:'Savings',status:'Pending',balance:0}},
  [['Deposit',10000,'UPI Demo','Opening deposit',8]]);
 save()}
const badge=s=>`<span class="b ${s==='Active'?'g':s==='Pending'?'y':'r'}">${esc(s)}</span>`;
function receiptText(t){const u=db.users.find(x=>x.id===t.uid)||{};return`SECUREBANK – DEMO RECEIPT (SIMULATED, NO REAL MONEY)\nTransaction ID: ${t.id}\nType: ${t.type}\nCustomer: ${u.name}\nAccount: ${t.acc}\nAmount: ${inr(t.amount)}\nMethod: ${t.method}\nDescription: ${t.desc||'-'}\nDate/Time: ${fd(t.ts)}\nBalance after: ${inr(t.bal)}`}
function showReceipt(id){const t=db.txns.find(x=>x.id===id);if(!t)return;S.rid=id;const u=db.users.find(x=>x.id===t.uid)||{};
 $('#modal').innerHTML=`<div class="ov" data-act="close"><div class="rc" role="dialog" aria-modal="true"><h2>✅ ${t.type} Successful</h2><p class="mut" style="margin:0 0 10px">Simulated demo transaction receipt</p><div class="kv"><b>Transaction ID</b><span>${t.id}</span><b>Customer</b><span>${esc(u.name)}</span><b>Account</b><span>${t.acc}</span><b>Amount</b><span><b style="color:var(--tx)">${inr(t.amount)}</b></span><b>Method</b><span>${esc(t.method)}</span><b>Description</b><span>${esc(t.desc||'-')}</span><b>Date &amp; time</b><span>${fd(t.ts)}</span><b>Balance after</b><span>${inr(t.bal)}</span></div><div class="demo">Demo only – no real money moved.</div><div class="row"><button class="btn" data-act="copy">Copy receipt</button><button class="btn alt" data-act="print">Print / Save PDF</button><button class="btn alt" data-act="close">Close</button></div></div></div>`}
function txTable(l,adm){if(!l.length)return'<p class="mut">No transactions found.</p>';
 return`<div class="tw"><table><tr><th>Date</th><th>ID</th>${adm?'<th>Customer</th>':''}<th>Type</th><th>Method</th><th>Description</th><th>Amount</th><th>Balance</th><th>Receipt</th></tr>${l.map(t=>{const d=t.type==='Deposit';return`<tr><td>${fd(t.ts)}</td><td>${t.id}</td>${adm?`<td>${esc((db.users.find(u=>u.id===t.uid)||{}).name)}</td>`:''}<td><span class="b ${d?'g':'r'}">${t.type}</span></td><td>${esc(t.method)}</td><td>${esc(t.desc||'-')}</td><td class="${d?'cr':'dr'}">${d?'+':'−'}${inr(t.amount)}</td><td>${inr(t.bal)}</td><td><button class="btn sm alt" data-act="receipt" data-id="${t.id}">View</button></td></tr>`}).join('')}</table></div>`}
const mine=u=>db.txns.filter(t=>t.uid===u.id).sort((a,b)=>b.ts.localeCompare(a.ts));
function histTable(){const u=me(),f=S.flt,q=(f.q||'').toLowerCase();return txTable(mine(u).filter(t=>(!f.type||t.type===f.type)&&(!f.from||ld(t.ts)>=f.from)&&(!f.to||ld(t.ts)<=f.to)&&(!q||(t.id+t.desc+t.method).toLowerCase().includes(q))),false)}
function custTable(){const q=S.aq.toLowerCase();const l=db.users.filter(u=>u.role==='customer'&&(!q||(u.name+u.email+u.id+u.mobile+u.acct.no).toLowerCase().includes(q)));
 if(!l.length)return'<p class="mut">No customers match.</p>';
 return`<div class="tw"><table><tr><th>Customer ID</th><th>Name</th><th>Email</th><th>Mobile</th><th>Account</th><th>Balance</th><th>Status</th></tr>${l.map(u=>`<tr><td>${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.mobile}</td><td>${u.acct.no}</td><td>${inr(u.acct.balance)}</td><td><select data-status="${u.id}" style="width:auto;padding:4px 8px">${['Active','Pending','Inactive'].map(s=>`<option${s===u.acct.status?' selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`}
const demoNote='<div class="demo">🎓 <b>Demo only:</b> all transactions and notifications on this site are simulated. No real money or bank accounts are involved.</div>';
const P={
home:()=>`<section class="hero"><div class="wrap"><span class="b">Fictional educational demo</span><h1>Smart banking, simplified.</h1><p>Open a demo savings account, deposit and withdraw simulated rupees, and see automatic notifications – all in one place.</p><div class="row"><a class="btn wh" href="#register">Open Demo Account</a><a class="btn alt" style="color:#fff;border-color:#8fb4e0" href="#login">Login</a></div></div></section>
<section class="sec"><div class="wrap"><h2>Our demo services</h2><p class="mut">Tap a card to explore.</p><div class="grid">${[['💰','Savings Accounts','Instantly get a demo account number.','#register'],['📲','Digital Banking Demo','Dashboard with live balance.','#dashboard'],['⬇️','Deposit Simulation','Cash, UPI or bank transfer demo.','#deposit'],['⬆️','Withdrawal Simulation','Balance-checked demo withdrawals.','#withdraw'],['📜','Transaction History','Search and filter transactions.','#history'],['💬','Customer Support','Reach our demo help desk.','#contact']].map(c=>`<a class="card" href="${c[3]}"><div class="ic">${c[0]}</div><h3>${c[1]}</h3><span class="mut">${c[2]}</span></a>`).join('')}</div></div></section>
<section class="sec" style="padding-top:0"><div class="wrap"><div class="card"><h3>Try it now</h3><p class="mut">Use demo logins on the <a href="#login">login page</a> – customer <b>aarav@demo.in</b> / <b>Demo@1234</b>, admin <b>admin@securebank.demo</b> / <b>Admin@123</b>.</p></div></div></section>`,
services:()=>`<section class="sec"><div class="wrap"><h2>Services</h2>${demoNote}<div class="grid">${[['Savings Account','Registration creates a demo savings account with a unique number.','Open account','#register'],['Deposit Money','Add simulated funds via Demo Cash, UPI Demo or Bank Transfer Demo.','Deposit','#deposit'],['Withdraw Money','Withdraw simulated funds, with insufficient-balance checks.','Withdraw','#withdraw'],['Transaction History','Search by text, type and date; view receipts.','View history','#history'],['Notifications','WhatsApp-style messages after each operation (demo mode).','See dashboard','#dashboard'],['Support','Questions? Send us a message.','Contact us','#contact']].map(c=>`<div class="card"><h3>${c[0]}</h3><p class="mut">${c[1]}</p><a class="btn alt sm" href="${c[3]}">${c[2]}</a></div>`).join('')}</div></div></section>`,
about:()=>`<section class="sec"><div class="wrap"><h2>About SecureBank</h2><p><b>“Your Trust, Our Priority”</b> – SecureBank is a <b>fictional educational demo</b> created for a college project. It holds no licence, RBI approval, partnership or deposit insurance.</p>
<div class="grid"><div class="card"><h3>Services</h3><ul><li>Savings Accounts</li><li>Digital Banking Demo</li><li>Fund Transfer Simulation</li><li>Deposit and Withdrawal Simulation</li><li>Transaction History</li><li>Customer Support</li></ul></div>
<div class="card"><h3>Demo contact details</h3><p>Email: support@securebank.demo <span class="b y">demo</span><br>Phone: +91 00000 00000 <span class="b y">demo</span></p></div>
<div class="card"><h3>Responsible banking tips</h3><ul><li>Never share your password or OTP.</li><li>Use a strong, unique password.</li><li>Check URLs before logging in.</li><li>Review statements regularly.</li><li>Bank staff never ask for your PIN.</li></ul></div></div>
<h2 style="margin-top:28px">FAQ</h2>${[['Is this a real bank?','No. It is a fictional demo and no real money is handled.'],['How do I get an account number?','Register – a Customer ID and account number are generated instantly.'],['Will I really get a WhatsApp message?','Not in demo mode. Messages are logged as “Simulated” until real API credentials are configured on a backend.'],['Why was my deposit rejected?','Amounts must be positive, the account number must be yours, and the account must be Active.']].map(f=>`<details><summary>${f[0]}</summary><p class="mut">${f[1]}</p></details>`).join('')}</div></section>`,
contact:()=>`<div class="wrap"><div class="card fc"><h2>Contact Us</h2><p class="mut">Demo support: support@securebank.demo (fictional).</p><form data-form="contact"><label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Message</label><textarea name="msg" rows="4" required></textarea><div class="err"></div><p><button class="btn">Send message</button></p></form></div></div>`,
login:()=>S.otp?otpView():`<div class="wrap"><div class="card fc"><h2>Login</h2><form data-form="login"><label>Email or Customer ID</label><input name="id" required autocomplete="username"><label>Password</label><input name="password" type="password" required autocomplete="current-password"><div class="err"></div><p><button class="btn">Login</button> <a href="#register" class="btn alt">Create account</a></p></form><div class="demo"><b>Demo logins</b> (click to fill; an OTP step follows):<br><button class="btn sm alt" data-act="fill" data-u="aarav@demo.in" data-p="Demo@1234">Customer</button> <button class="btn sm alt" data-act="fill" data-u="admin@securebank.demo" data-p="Admin@123">Admin</button></div></div></div>`,
register:()=>{if(S.reg){const u=S.reg;return`<div class="wrap"><div class="card fc"><h2>🎉 Registration successful!</h2><p>Welcome to SecureBank, ${esc(u.name)}. This is a demo registration.</p><div class="kv"><b>Customer ID</b><span>${u.id}</span><b>Account number</b><span>${u.acct.no}</span><b>Account type</b><span>Savings (demo)</span><b>Status</b><span>${badge(u.acct.status)}</span></div><div class="demo">Two demo notifications were logged (registration &amp; account creation). They were <b>not</b> delivered – demo mode.</div><p><a class="btn" href="#login">Login now</a></p></div></div>`}
 return`<div class="wrap"><div class="card fc" style="max-width:660px"><h2>Open a demo account</h2><p class="mut">All fields required. Fictional demo – do not enter real sensitive data.</p><form data-form="register"><div class="two"><div><label>Full Name</label><input name="name" required></div><div><label>Email Address</label><input name="email" type="email" required></div><div><label>Mobile Number</label><input name="mobile" inputmode="numeric" maxlength="10" required></div><div><label>Date of Birth</label><input name="dob" type="date" required></div></div><label>Address</label><textarea name="address" rows="2" required></textarea><div class="two"><div><label>Password</label><input name="password" type="password" required autocomplete="new-password"></div><div><label>Confirm Password</label><input name="confirm" type="password" required autocomplete="new-password"></div></div><div class="err"></div><p><button class="btn">Register</button> <a class="btn alt" href="#login">I have an account</a></p></form></div></div>`},
dashboard:()=>{const u=me(),a=u.acct,ns=db.notifs.filter(n=>n.uid===u.id).slice(0,4);
 return`<section class="sec"><div class="wrap"><h2>Hello, ${esc(u.name.split(' ')[0])} 👋</h2>${demoNote}<div class="grid"><div class="bal"><small>Total demo balance</small><div class="stat">${inr(a.balance)}</div><div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn wh sm" href="#deposit">Deposit Money</a><a class="btn wh sm" href="#withdraw">Withdraw Money</a></div></div>
<div class="card"><h3>Account information</h3><div class="kv"><b>Name</b><span>${esc(u.name)}</span><b>Account no.</b><span>${a.no}</span><b>Type</b><span>${a.type}</span><b>Status</b><span>${badge(a.status)}</span><b>Customer ID</b><span>${u.id}</span></div><p><a class="btn alt sm" href="#profile">View profile</a></p></div></div>
<div class="card" style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h3 style="margin:0">Recent transactions</h3><a class="btn alt sm" href="#history">Full history</a></div>${txTable(mine(u).slice(0,5),false)}</div>
<div class="card" style="margin-top:16px"><h3>Your notifications <span class="b y">demo mode</span></h3>${ns.length?ns.map(n=>`<p style="margin:8px 0"><b>${n.event}</b> · <span class="mut">${fd(n.ts)} · ${n.status}</span><br>${esc(n.message)}</p>`).join(''):'<p class="mut">No notifications yet.</p>'}</div></div></section>`},
profile:()=>{const u=me();return`<div class="wrap"><div class="card fc"><h2>My profile</h2><div class="kv"><b>Customer ID</b><span>${u.id}</span><b>Full name</b><span>${esc(u.name)}</span><b>Email</b><span>${esc(u.email)}</span><b>Mobile</b><span>${u.mobile}</span><b>Date of birth</b><span>${u.dob}</span><b>Address</b><span>${esc(u.address)}</span><b>Account no.</b><span>${u.acct.no}</span><b>Account type</b><span>${u.acct.type}</span><b>Status</b><span>${badge(u.acct.status)}</span><b>Member since</b><span>${fd(u.created)}</span></div><p><a class="btn" href="#dashboard">Back to dashboard</a></p></div></div>`},
history:()=>`<section class="sec"><div class="wrap"><h2>Transaction history</h2><form data-live="hist" class="card"><div class="grid"><div><label>Search</label><input name="q" placeholder="ID or description"></div><div><label>Type</label><select name="type"><option value="">All</option><option>Deposit</option><option>Withdrawal</option></select></div><div><label>From</label><input type="date" name="from"></div><div><label>To</label><input type="date" name="to"></div></div><p><button type="button" class="btn alt sm" data-act="clear">Clear filters</button></p></form><div class="card" style="margin-top:16px" id="live">${histTable()}</div></div></section>`,
admin:()=>{const cs=db.users.filter(u=>u.role==='customer'),sm=t=>db.txns.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0),tb=['overview','customers','transactions','notifications'];let c='';
 if(S.tab==='overview'){const meth={};db.txns.filter(t=>t.type==='Deposit').forEach(t=>meth[t.method]=(meth[t.method]||0)+t.amount);const mx=Math.max(1,...Object.values(meth));
  c=`<div class="grid">${[['Customers',cs.length],['Accounts',cs.length],['Total deposits',inr(sm('Deposit'))],['Total withdrawals',inr(sm('Withdrawal'))],['Net demo balance',inr(cs.reduce((s,u)=>s+u.acct.balance,0))],['Notifications logged',db.notifs.length]].map(s=>`<div class="card stat">${s[1]}<small>${s[0]}</small></div>`).join('')}</div><div class="card" style="margin-top:16px"><h3>Deposits by method</h3><div class="bars">${Object.entries(meth).map(([k,v])=>`<div><span style="width:${Math.round(v/mx*55)+5}%"></span>${esc(k)} – ${inr(v)}</div>`).join('')||'<p class="mut">No data.</p>'}</div><h3>Accounts by status</h3><p>${['Active','Pending','Inactive'].map(s=>`${badge(s)} ${cs.filter(u=>u.acct.status===s).length}`).join(' &nbsp; ')}</p><button class="btn ${S.rst?'red':'alt'} sm" data-act="reset">${S.rst?'Click again to confirm reset':'Reset demo data'}</button></div>`}
 if(S.tab==='customers')c=`<div class="card"><label style="margin-top:0">Search customers</label><input data-live="cust" placeholder="Name, email, ID, mobile, account" value="${esc(S.aq)}"><div id="live" style="margin-top:12px">${custTable()}</div></div>`;
 if(S.tab==='transactions')c=`<div class="card">${txTable([...db.txns].sort((a,b)=>b.ts.localeCompare(a.ts)),true)}</div>`;
 if(S.tab==='notifications')c=`<div class="card"><p class="mut">Demo mode: messages are logged, never delivered. Real delivery needs a backend with WhatsApp Cloud API credentials.</p>${db.notifs.length?`<div class="tw"><table><tr><th>Time</th><th>To</th><th>Channel</th><th>Event</th><th>Status</th><th>Error</th><th>Message</th></tr>${db.notifs.map(n=>`<tr><td>${fd(n.ts)}</td><td>${n.to}</td><td>${n.channel}</td><td>${n.event}</td><td><span class="b y">${n.status}</span></td><td style="white-space:normal;min-width:180px">${esc(n.error)}</td><td style="white-space:normal;min-width:240px">${esc(n.message)}</td></tr>`).join('')}</table></div>`:'<p>No notifications.</p>'}</div>`;
 return`<section class="sec"><div class="wrap"><h2>Admin dashboard</h2><div class="tabs">${tb.map(t=>`<button class="btn ${S.tab===t?'on':''}" data-act="tab" data-v="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${c}</div></section>`},
};
function money(type){const u=me(),w=type==='Withdrawal';return`<div class="wrap"><div class="card fc"><h2>${w?'Withdraw':'Deposit'} Money</h2>${demoNote}<p class="mut">Available demo balance: <b>${inr(u.acct.balance)}</b></p><form data-form="${w?'withdraw':'deposit'}"><label>Account Number</label><input name="acc" value="${u.acct.no}" required><label>${type} Amount (₹)</label><input name="amount" type="number" step="0.01" min="0.01" required><label>Payment Method</label><select name="method"><option>Demo Cash</option><option>UPI Demo</option><option>Bank Transfer Demo</option></select><label>Transaction Description</label><input name="desc" maxlength="80" placeholder="Optional"><div class="err"></div><p><button class="btn">${w?'Withdraw':'Deposit'} (simulated)</button> <a class="btn alt" href="#dashboard">Cancel</a></p></form></div></div>`}
function otpView(){const o=S.otp,u=db.users.find(x=>x.id===o.uid),m=u.mobile.slice(0,2)+'XXXXXX'+u.mobile.slice(-2);
 return`<div class="wrap"><div class="card fc"><h2>Verify OTP</h2><p class="mut">A 6-digit OTP was generated for mobile ${m}. It is valid for 5 minutes (3 attempts).</p><div class="demo"><b>Demo mode:</b> no SMS/WhatsApp provider is connected, so the OTP was <b>not actually sent</b>. Your demo OTP is <b style="font-size:20px;letter-spacing:3px">${o.code}</b></div><form data-form="otp"><label>Enter OTP</label><input name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required><div class="err"></div><p><button class="btn">Verify &amp; Login</button> <button type="button" class="btn alt" data-act="resend">Resend OTP</button> <button type="button" class="btn alt" data-act="cancelotp">Cancel</button></p></form></div></div>`}
P.deposit=()=>money('Deposit');P.withdraw=()=>money('Withdrawal');
function nav(k){const u=me();const l=(h,t,c)=>`<a href="#${h}" class="${c||''}${k===h?' on':''}">${t}</a>`;
 $('#nav').innerHTML=l('home','Home')+l('services','Services')+l('about','About')+l('contact','Contact')+(u?(u.role==='admin'?l('admin','Admin'):l('dashboard','Dashboard')+l('deposit','Deposit')+l('withdraw','Withdraw')+l('history','History')+l('profile','Profile'))+`<button data-act="logout">Logout</button>`:l('login','Login')+l('register','Register','cta'));$('#nav').classList.remove('open')}
function render(){const k0=location.hash.slice(1)||'home';let k=P[k0]?k0:'home';const u=me();
 if(['dashboard','deposit','withdraw','history','profile'].includes(k)){if(!u){toast('Please log in first.','bad');return location.hash='#login'}if(u.role==='admin')return location.hash='#admin'}
 if(k==='admin'){if(!u){toast('Please log in first.','bad');return location.hash='#login'}if(u.role!=='admin'){toast('Access denied: admin role required.','bad');return location.hash='#dashboard'}}
 if((k==='login'||k==='register')&&u)return location.hash=u.role==='admin'?'#admin':'#dashboard';
 if(k!=='register')S.reg=null;if(k!=='login')S.otp=null;
 $('#app').innerHTML=P[k]();nav(k);window.scrollTo(0,0)}
function setErr(f,e){f.querySelector('.err').innerHTML='<ul>'+e.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>'}
const F={
async register(d,f){const e=[],t=k=>(d[k]||'').trim();
 if(t('name').length<3||!/^[A-Za-z .'’-]+$/.test(t('name')))e.push('Enter a valid full name (letters only, min 3 characters).');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(t('email')))e.push('Enter a valid email address.');
 if(!/^[6-9]\d{9}$/.test(t('mobile')))e.push('Enter a valid 10-digit Indian mobile number.');
 const dob=new Date(t('dob'));if(!t('dob')||isNaN(dob)||(Date.now()-dob)/31557600000<18)e.push('You must be at least 18 years old.');
 if(t('address').length<8)e.push('Enter your full address (min 8 characters).');
 if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(d.password||''))e.push('Password needs 8+ characters with letters and numbers.');
 if(d.password!==d.confirm)e.push('Passwords do not match.');
 if(!e.length){if(db.users.some(u=>u.email===t('email').toLowerCase()))e.push('This email is already registered.');if(db.users.some(u=>u.mobile===t('mobile')))e.push('This mobile number is already registered.')}
 if(e.length)return setErr(f,e);
 const id='CUST'+(++db.seq),salt='s'+id+Math.random().toString(36).slice(2),u={id,role:'customer',name:t('name'),email:t('email').toLowerCase(),mobile:t('mobile'),dob:t('dob'),address:t('address'),salt,pw:await hash(d.password,salt),acct:{no:newAcc(),type:'Savings',status:'Active',balance:0},created:now()};
 db.users.push(u);notify(u,'Registration',`Welcome to SecureBank! Your demo registration was successful. Your Customer ID is ${id}.`);
 notify(u,'Account Creation',`Dear ${u.name}, your SecureBank demo account has been created successfully. Your account number is ${u.acct.no}.`);
 save();S.reg=u;render();toast('Registered! Notifications logged (demo mode).')},
async login(d,f){const k=(d.id||'').trim().toLowerCase(),u=db.users.find(x=>x.email===k||x.id.toLowerCase()===k);
 if(!u||u.pw!==await hash(d.password||'',u.salt))return setErr(f,['Invalid email/Customer ID or password.']);
 return startOtp(u)},
otp(d,f){const o=S.otp;if(!o)return render();
 if(Date.now()>o.exp){S.otp=null;render();return toast('OTP expired. Please log in again.','bad')}
 if((d.otp||'').trim()!==o.code){o.tries++;if(o.tries>=3){S.otp=null;render();return toast('Too many wrong attempts. Please log in again.','bad')}return setErr(f,[`Incorrect OTP. ${3-o.tries} attempt(s) left.`])}
 const u=db.users.find(x=>x.id===o.uid);S.otp=null;db.session=u.id;save();toast('Welcome, '+u.name.split(' ')[0]+'!');location.hash=u.role==='admin'?'#admin':'#dashboard'},
contact(d,f){const e=[];if(d.msg.trim().length<5)e.push('Please write a longer message.');if(e.length)return setErr(f,e);(db.msgs=db.msgs||[]).push({...d,ts:now()});save();f.reset();f.querySelector('.err').innerHTML='';toast('Message received (demo support). Thank you!')},
deposit(d,f){F.txn(d,f,'Deposit')},withdraw(d,f){F.txn(d,f,'Withdrawal')},
txn(d,f,type){const u=me(),a=u.acct,e=[],amt=Math.round(parseFloat(d.amount)*100)/100;
 if((d.acc||'').trim().toUpperCase()!==a.no)e.push('Account number does not match your account.');
 if(a.status!=='Active')e.push(`Your account is ${a.status}. Transactions need an Active account.`);
 if(!(amt>0))e.push('Enter a valid positive amount.');else if(amt>1000000)e.push('Demo limit is ₹10,00,000 per transaction.');else if(type==='Withdrawal'&&amt>a.balance)e.push(`Insufficient balance. Available: ${inr(a.balance)}.`);
 if(e.length)return setErr(f,e);
 a.balance=Math.round((a.balance+(type==='Deposit'?amt:-amt))*100)/100;
 const t={id:tid(),uid:u.id,acc:a.no,type,amount:amt,method:d.method,desc:(d.desc||'').trim(),ts:now(),bal:a.balance};db.txns.push(t);
 notify(u,type,type==='Deposit'?`Dear ${u.name}, your demo deposit of ₹${amt} was successful. Transaction ID: ${t.id}. Available demo balance: ₹${a.balance}.`:`Dear ${u.name}, your demo withdrawal of ₹${amt} was processed successfully. Transaction ID: ${t.id}.`);
 save();render();showReceipt(t.id);toast(type+' simulated. Notification logged (demo mode).')}};
document.addEventListener('submit',async e=>{const f=e.target,n=f.dataset.form;if(!n)return;e.preventDefault();try{await F[n](Object.fromEntries(new FormData(f)),f)}catch(x){toast('Something went wrong: '+x.message,'bad')}});
document.addEventListener('input',e=>{const f=e.target.closest('[data-live]');if(!f)return;if(f.dataset.live==='hist'){S.flt=Object.fromEntries(new FormData(f));$('#live').innerHTML=histTable()}else{S.aq=e.target.value;$('#live').innerHTML=custTable()}});
document.addEventListener('change',e=>{const s=e.target.dataset&&e.target.dataset.status;if(!s)return;const u=db.users.find(x=>x.id===s);u.acct.status=e.target.value;save();toast(`${u.name}’s account set to ${u.acct.status}.`)});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='close'){if(e.target!==b)return;$('#modal').innerHTML='';return}
 if(a==='menu')$('#nav').classList.toggle('open');
 if(a==='resend'&&S.otp)startOtp(db.users.find(x=>x.id===S.otp.uid),true);
 if(a==='cancelotp'){S.otp=null;render()}
 if(a==='logout'){db.session=null;save();toast('Logged out.');if(location.hash==='#home')render();else location.hash='#home'}
 if(a==='fill'){const f=$('[data-form=login]');f.id.value=b.dataset.u;f.password.value=b.dataset.p}
 if(a==='receipt')showReceipt(b.dataset.id);
 if(a==='copy'){try{await navigator.clipboard.writeText(receiptText(db.txns.find(t=>t.id===S.rid)));toast('Receipt copied to clipboard.')}catch(x){toast('Copy was blocked by the browser.','bad')}}
 if(a==='print'){try{window.print()}catch(x){toast('Printing is not available here.','bad')}}
 if(a==='clear'){S.flt={};const f=$('[data-live=hist]');f.reset();$('#live').innerHTML=histTable()}
 if(a==='tab'){S.tab=b.dataset.v;S.rst=false;render()}
 if(a==='reset'){if(!S.rst){S.rst=true;render();return}S.rst=false;await seed();db.session='ADM001';save();render();toast('Demo data reset.')}});
window.addEventListener('hashchange',()=>{$('#modal').innerHTML='';render()});
(async()=>{db=load();if(!db||!db.v)await seed();render()})();
</script></body></html>
